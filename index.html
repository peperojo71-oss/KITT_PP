<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KITT Dashboard</title>
  <style>
    body {
      background-color: #0b0f19;
      color: #00ffcc;
      font-family: monospace;
      padding: 20px;
      margin: 0;
    }
    .scanner {
      height: 4px;
      background: #ff0000;
      box-shadow: 0 0 10px #ff0000;
      margin-bottom: 20px;
    }
    textarea, input[type="password"] {
      width: 100%;
      background: #111;
      color: #00ffcc;
      border: 1px solid #00ffcc;
      padding: 10px;
      box-sizing: border-box;
      font-family: monospace;
      margin-top: 8px;
    }
    textarea {
      height: 80px;
    }
    button.small {
      background: #00ffcc;
      color: #000;
      border: none;
      padding: 10px 20px;
      font-weight: bold;
      margin-top: 10px;
      cursor: pointer;
    }
    button.danger {
      background: transparent;
      color: #ff4444;
      border: 1px solid #ff4444;
      padding: 6px 12px;
      font-family: monospace;
      margin-top: 25px;
      cursor: pointer;
      font-size: 12px;
    }
    .answer {
      margin-top: 20px;
      padding: 10px;
      border: 1px dashed #00ffcc;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="scanner"></div>
  <div id="app"></div>

  <script>
    const $ = (selector) => document.querySelector(selector);
    
    function show(title, subtitle, contentHtml) {
      $('#app').innerHTML = `<h2>${title}</h2><p>${subtitle}</p>${contentHtml}`;
    }

    function setStatus(statusText) {
      document.title = `KITT - ${statusText}`;
    }

    function speak(text) {
      if ('speechSynthesis' in window) {
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'es-ES';
        utterance.pitch = 0.6;
        utterance.rate = 1.0;
        
        const voices = window.speechSynthesis.getVoices();
        const spanishVoice = voices.find(v => v.lang.includes('es') && (v.name.includes('Jorge') || v.name.includes('Álvaro') || v.name.includes('Male') || v.name.includes('Pablo')));
        if (spanishVoice) utterance.voice = spanishVoice;

        window.speechSynthesis.speak(utterance);
      }
    }

    function setupKey() {
      show('SEGURIDAD KITT', 'Introduce tu clave de API. Se guardará únicamente en la memoria privada de este teléfono.', `
        <input type="password" id="apiKeyInput" placeholder="Pega aquí tu clave de Google AI Studio..." />
        <button class="small" id="saveKeyBtn">GUARDAR EN ESTE DISPOSITIVO</button>
      `);

      $('#saveKeyBtn').onclick = () => {
        const key = $('#apiKeyInput').value.trim();
        if (!key) return;
        localStorage.setItem('kitt_gemini_key', key);
        assistant();
      };
    }

    async function assistant() {
      const savedKey = localStorage.getItem('kitt_gemini_key');
      if (!savedKey) {
        setupKey();
        return;
      }

      show('ASISTENTE KITT', 'Habla o escribe tu consulta para KITT.', `
        <textarea id="question" placeholder="Pulsa aquí y usa el micrófono de tu teclado..."></textarea>
        <button class="small" id="askBtn">CONSULTAR A KITT</button>
        <div class="answer" id="answer">A la espera de instrucciones, Pepe.</div>
        <button class="danger" id="resetKeyBtn">BORRAR CLAVE DE ESTE TELÉFONO</button>
      `);

      $('#resetKeyBtn').onclick = () => {
        localStorage.removeItem('kitt_gemini_key');
        setupKey();
      };

      $('#askBtn').onclick = async () => {
        const q = $('#question').value.trim();
        if (!q) return;

        const API_KEY = localStorage.getItem('kitt_gemini_key');

        $('#answer').textContent = 'Analizando datos en la red neuronal...';
        setStatus('PROCESANDO IA');

        try {
          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${API_KEY}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{
                parts: [{
                  text: `Actúa exactamente como KITT, el ordenador inteligente de El Coche Fantástico. Habla en español, con tono educado, lógico, formal y leal. Llámame Pepe. Responde de forma concisa y directa (máximo 3 frases) a esta consulta: ${q}`
                }]
              }]
            })
          });

          const data = await response.json();
          
          if (data.error) {
            $('#answer').textContent = 'Error de Google: ' + data.error.message;
            setStatus('ERROR DE API');
            return;
          }

          const respuestaKitt = data.candidates[0].content.parts[0].text;

          $('#answer').textContent = respuestaKitt;
          setStatus('SYSTEM READY');
          speak(respuestaKitt);

        } catch (error) {
